<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>時區通</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
 body{background:#0f172a; color:#fff; margin:0; padding:12px; font-family:-apple-system,system-ui; user-select:none; padding-bottom: 60px;}
.top{max-width:440px; margin:0 auto 8px; display:flex; gap:8px}
 input[type="text"]{flex:1; background:#1e293b; color:#fff; border:1px solid #334155; border-radius:10px; padding:10px 12px; font-size:14px; font-weight:700; outline:none}
 input[type="text"]::placeholder{color:#64748b}
 button{background:#22c55e; color:#000; border:0; border-radius:10px; padding:0 14px; font-weight:900; font-size:13px; cursor:pointer; transition:opacity 0.2s}
 button:active{opacity:0.8}
 
.controls{max-width:440px; margin:0 auto 12px; display:flex; gap:6px; background:#1e293b; padding:8px; border-radius:10px; align-items:center; justify-content:space-between; border:1px solid #334155}
.controls button{background:#334155; color:#fff; padding:6px 12px; font-size:12px; border-radius:6px}
.time-display{font-size:13px; font-weight:700; color:#38bdf8; text-align:center; flex:1}

.wrap{max-width:440px; margin:0 auto; position:relative; touch-action:pan-y; cursor:grab}
.wrap:active{cursor:grabbing}
.axis{position:relative; height:760px; border-left:2px solid #334155; margin-left:58px}
.tick{position:absolute; left:-64px; width:56px; text-align:right; font-size:11px; color:#64748b; transform:translateY(-50%)}
.row{position:absolute; left:10px; right:0; display:flex; gap:6px}
.card{flex:1; height:30px; line-height:30px; background:#1e293b; border-radius:8px; padding:0 10px; font-size:14px; font-weight:800; border-left:4px solid; display:flex; justify-content:space-between; gap:4px; white-space:nowrap; overflow:hidden; pointer-events:none}
.date{font-size:11px; color:#94a3b8; margin-right:4px}
.dateline{position:absolute; left:-2px; right:0; border-top:1.5px dashed #ef4444; pointer-events:none}

/* 可跟隨滑動移動的藍色基準線，範圍擴展至整個卡片區塊寬度 */
.movable-vline{position:absolute; top:0; bottom:0; width:0; border-left:2px dashed #38bdf8; pointer-events:none; z-index:10; left: 50%;}
.movable-label{position:absolute; top:-18px; transform: translateX(-50%); font-size:10px; color:#38bdf8; background:#0f172a; padding:0 4px; font-weight:700; white-space:nowrap; border:1px solid #334155; border-radius:4px}

.hint{max-width:440px; margin:12px auto 0; text-align:center; font-size:11px; color:#64748b}
</style>
</head>
<body>
<div class="top">
  <input type="text" id="cityInput" list="cityOptions" placeholder="搜尋或選擇城市加入...">
  <datalist id="cityOptions"></datalist>
  <button onclick="addCity()">+ ADD</button>
</div>

<div class="controls">
  <button onclick="shiftTime(-0.5)">-0.5時</button>
  <div class="time-display" id="timeDisplay">載入中...</div>
  <button onclick="shiftTime(0.5)">+0.5時</button>
  <button onclick="resetTime()">現在</button>
</div>

<div class="wrap" id="swipeWrap">
  <div class="axis" id="axis">
    <div class="movable-vline" id="moveVLine" style="left: 50%;">
      <div class="movable-label" id="moveLabel">📍 基準時間</div>
    </div>
  </div>
</div>
<div class="hint">左右滑動卡片區域可讓藍線在 ±12 小時範圍內自由移動</div>

<script>
const allCities=[
 {name:'Majuro',offset:12,color:'#facc15'},
 {name:'Auckland',offset:12,color:'#facc15'},
 {name:'Fiji',offset:12,color:'#facc15'},
 {name:'Wellington',offset:12,color:'#facc15'},
 {name:'Sydney',offset:10,color:'#fb7185'},
 {name:'Melbourne',offset:10,color:'#fb7185'},
 {name:'Brisbane',offset:10,color:'#fb7185'},
 {name:'Guam',offset:10,color:'#fb7185'},
 {name:'Tokyo',offset:9,color:'#f472b6'},
 {name:'Seoul',offset:9,color:'#f472b6'},
 {name:'Busan',offset:9,color:'#f472b6'},
 {name:'Beijing',offset:8,color:'#22c55e'},
 {name:'Shanghai',offset:8,color:'#22c55e'},
 {name:'Hong Kong',offset:8,color:'#22c55e'},
 {name:'Singapore',offset:8,color:'#22c55e'},
 {name:'Taipei',offset:8,color:'#22c55e'},
 {name:'Kaohsiung',offset:8,color:'#22c55e'},
 {name:'Manila',offset:8,color:'#22c55e'},
 {name:'Kuala Lumpur',offset:8,color:'#22c55e'},
 {name:'Bangkok',offset:7,color:'#2dd4bf'},
 {name:'Jakarta',offset:7,color:'#2dd4bf'},
 {name:'Ho Chi Minh',offset:7,color:'#2dd4bf'},
 {name:'Dhaka',offset:6,color:'#60a5fa'},
 {name:'Mumbai',offset:5,color:'#a78bfa'},
 {name:'Delhi',offset:5,color:'#a78bfa'},
 {name:'New Delhi',offset:5,color:'#a78bfa'},
 {name:'Karachi',offset:5,color:'#a78bfa'},
 {name:'Dubai',offset:4,color:'#fbbf24'},
 {name:'Moscow',offset:3,color:'#c084fc'},
 {name:'Istanbul',offset:3,color:'#c084fc'},
 {name:'Cairo',offset:2,color:'#a78bfa'},
 {name:'Athens',offset:2,color:'#a78bfa'},
 {name:'Paris',offset:2,color:'#a78bfa'},
 {name:'Berlin',offset:2,color:'#a78bfa'},
 {name:'Rome',offset:2,color:'#a78bfa'},
 {name:'Amsterdam',offset:2,color:'#a78bfa'},
 {name:'Madrid',offset:2,color:'#a78bfa'},
 {name:'Vienna',offset:2,color:'#a78bfa'},
 {name:'London',offset:1,color:'#94a3b8'},
 {name:'Dublin',offset:1,color:'#94a3b8'},
 {name:'Lagos',offset:1,color:'#94a3b8'},
 {name:'Azores',offset:0,color:'#64748b'},
 {name:'Reykjavik',offset:0,color:'#64748b'},
 {name:'New York',offset:-4,color:'#38bdf8'},
 {name:'Toronto',offset:-4,color:'#38bdf8'},
 {name:'Santiago',offset:-4,color:'#38bdf8'},
 {name:'Chicago',offset:-5,color:'#38bdf8'},
 {name:'Mexico City',offset:-6,color:'#38bdf8'},
 {name:'Denver',offset:-6,color:'#38bdf8'},
 {name:'Los Angeles',offset:-7,color:'#38bdf8'},
 {name:'San Francisco',offset:-7,color:'#38bdf8'},
 {name:'Millbrae',offset:-7,color:'#38bdf8'},
 {name:'Vancouver',offset:-7,color:'#38bdf8'},
 {name:'Anchorage',offset:-8,color:'#fbbf24'},
 {name:'Honolulu',offset:-10,color:'#fbbf24'},
 {name:'Tahiti',offset:-10,color:'#fbbf24'},
 {name:'Pago Pago',offset:-11,color:'#f97316'},
];

allCities.sort((a, b) => a.name.localeCompare(b.name));

let cities=JSON.parse(localStorage.getItem('myCities16')||'null')||[
 {name:'Majuro',offset:12,color:'#facc15'},
 {name:'Guam',offset:10,color:'#fb7185'},
 {name:'Tokyo',offset:9,color:'#f472b6'},
 {name:'Taipei',offset:8,color:'#22c55e'},
 {name:'San Francisco',offset:-7,color:'#38bdf8'},
 {name:'Tahiti',offset:-10,color:'#fbbf24'}
];

let totalMinutesOffset = 0; // 範圍從 -720 到 +720 分鐘 (±12小時)

const axis=document.getElementById('axis');
function initAxisTicks(){
  const vLineEl = document.getElementById('moveVLine');
  axis.innerHTML = '';
  for(let off=12; off>=-11; off--){
    const top=(12-off)/23*760;
    axis.innerHTML+=`<div class="tick" style="top:${top}px">UTC${off>=0?'+':''}${off}</div>`;
  }
  if(vLineEl) axis.appendChild(vLineEl);
  else {
    axis.innerHTML+=`<div class="movable-vline" id="moveVLine" style="left: 50%;"><div class="movable-label" id="moveLabel">📍 基準時間</div></div>`;
  }
}
initAxisTicks();

const cityInput=document.getElementById('cityInput');
const cityOptions=document.getElementById('cityOptions');

function refreshSelect(){
  cityOptions.innerHTML='';
  allCities.forEach((c)=>{
    if(!cities.find(x=>x.name.toLowerCase()===c.name.toLowerCase())){
      const opt=document.createElement('option');
      opt.value=`${c.name} (UTC${c.offset>=0?'+':''}${c.offset})`;
      cityOptions.appendChild(opt);
    }
  });
}

function save(){localStorage.setItem('myCities16',JSON.stringify(cities));}

function addCity(){
  const val=cityInput.value.trim();
  if(!val) return;
  const cityName = val.split(' (')[0].trim();
  const c = allCities.find(x => x.name.toLowerCase() === cityName.toLowerCase());
  if(c && !cities.find(x=>x.name.toLowerCase()===c.name.toLowerCase())){
    cities.push(c); 
    save(); 
    cityInput.value='';
    refreshSelect(); 
    update();
  }
}

cityInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addCity();
});

function removeCity(n){
  if(confirm(`確定要刪除 ${n} 嗎？`)){
    cities=cities.filter(c=>c.name!==n); 
    save(); 
    refreshSelect(); 
    update();
  }
}

refreshSelect();

function shiftTime(h){
  totalMinutesOffset += h * 60;
  if(totalMinutesOffset > 720) totalMinutesOffset = 720;
  if(totalMinutesOffset < -720) totalMinutesOffset = -720;
  update();
}

function resetTime(){
  totalMinutesOffset = 0;
  update();
}

// 左右滑動控制：將滑動距離對應至卡片區域的總寬度，讓 ±12 小時剛好佔滿整個區塊
const wrap = document.getElementById('swipeWrap');
let startX = 0;
let baseOffsetOnStart = 0;
let isDragging = false;

wrap.addEventListener('pointerdown', (e) => {
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  isDragging = true;
  startX = e.clientX;
  baseOffsetOnStart = totalMinutesOffset;
  wrap.setPointerCapture(e.pointerId);
});

wrap.addEventListener('pointermove', (e) => {
  if(!isDragging) return;
  const deltaX = e.clientX - startX;
  const cardAreaWidth = wrap.clientWidth - 70; // 扣除左側刻度寬度後的實際卡片區塊寬度
  
  // 總共 24 小時 (1440分鐘) 對應整個卡片區塊寬度
  // 往右滑 deltaX 為正，代表時間變晚 (+)
  const minutesChange = (deltaX / cardAreaWidth) * 1440;
  let newOffset = baseOffsetOnStart + minutesChange;
  
  if(newOffset > 720) newOffset = 720;
  if(newOffset < -720) newOffset = -720;
  
  totalMinutesOffset = newOffset;
  update();
});

wrap.addEventListener('pointerup', (e) => {
  if(!isDragging) return;
  isDragging = false;
  wrap.releasePointerCapture(e.pointerId);
});

wrap.addEventListener('pointercancel', () => {
  isDragging = false;
});

function update(){
  const now = new Date(new Date().getTime() + totalMinutesOffset * 60 * 1000);
  const utcH = now.getUTCHours() + now.getUTCMinutes()/60 + now.getUTCSeconds()/3600;
  
  const displayDate = `${now.getMonth()+1}/${now.getDate()}`;
  const displayTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  
  let hoursTotalFloat = totalMinutesOffset / 60;
  let offsetStr = '現在';
  if(Math.abs(totalMinutesOffset) >= 30) {
    const sign = hoursTotalFloat > 0 ? '+' : '';
    offsetStr = `${sign}${hoursTotalFloat.toFixed(1)}h`;
  }
  document.getElementById('timeDisplay').textContent = `${displayDate} ${displayTime} (${offsetStr})`;

  document.querySelectorAll('.row,.dateline').forEach(e=>e.remove());
  
  // 讓藍線位置根據總分鐘偏移量（-720 到 +720）線性對應到卡片區塊的寬度內
  const vLineEl = document.getElementById('moveVLine');
  if(vLineEl) {
    const cardAreaWidth = wrap.clientWidth - 70;
    // 將 -720~720 分鐘對應到 -0.5*width 到 +0.5*width 的像素位移
    const pixelOffset = (totalMinutesOffset / 1440) * cardAreaWidth;
    vLineEl.style.left = `calc(50% + ${pixelOffset}px)`;
  }
  
  const groups={}; 
  cities.forEach(c=>{
    if(!groups[c.offset]) groups[c.offset]=[]; 
    groups[c.offset].push(c);
  });
  
  const sorted=Object.keys(groups).map(Number).sort((a,b)=>b-a);
  let diffs={}, dates={};
  
  sorted.forEach(off=>{
    let v=utcH+off; 
    diffs[off]=v<0?-1:v>=24?1:0;
    const simpleLd = new Date(now.getTime() + (off * 3600 * 1000));
    dates[off]=`${simpleLd.getUTCMonth()+1}/${simpleLd.getUTCDate()}`;
  });
  
  const max=Math.max(...Object.values(diffs));
  let lineOff=null;
  for(let i=0;i<sorted.length-1;i++){
    if(diffs[sorted[i]]===max && diffs[sorted[i+1]]<max){
      lineOff=(sorted[i]+sorted[i+1])/2;
      break;
    }
  }

  sorted.forEach(off=>{
    let local=utcH+off; 
    if(local<0) local+=24; 
    if(local>=24) local-=24;
    
    const time=`${String(Math.floor(local)).padStart(2,'0')}:${String(now.getUTCMinutes()).padStart(2,'0')}`;
    const base=(12-off)/23*760;
    
    for(let i=0;i<groups[off].length;i+=3){
      const row=document.createElement('div'); 
      row.className='row'; 
      row.style.top=(base+(i/3)*34)+'px'; 
      row.style.opacity=diffs[off]<max?'0.55':'1';
      
      groups[off].slice(i,i+3).forEach(c=>{
        const card=document.createElement('div'); 
        card.className='card'; 
        card.style.borderColor=c.color;
        const offStr = c.offset >= 0 ? `+${c.offset}` : c.offset;
        card.innerHTML=`<span class="city-name">${c.name} <span class="tz-tag">(${offStr})</span></span><span><span class="date">${dates[off]}</span> ${time}</span>`;
        card.onclick=()=>removeCity(c.name); 
        row.appendChild(card);
      });
      axis.appendChild(row);
    }
  });
  
  if(lineOff!==null){
    const l=document.createElement('div'); 
    l.className='dateline'; 
    l.style.top=(12-lineOff)/23*760+'px';
    axis.appendChild(l);
  }
}

update(); 
</script>
</body>
</html>
